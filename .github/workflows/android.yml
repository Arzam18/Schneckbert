
name: Schneckbert Android ARM64 NativeAOT

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**.cs"
      - "**.csproj"
      - "Evaluate/Nets/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Schneckbert UCI for Android ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Schneckbert
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Install build utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm binutils \
            build-essential zlib1g-dev python3

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/clang"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          "$TOOLCHAIN/clang" --version
          dotnet --version

      - name: Verify project and NNUE
        shell: bash
        run: |
          set -euo pipefail

          test -f Schneckbert.csproj
          test -f Program.cs
          test -f Evaluate/Evaluate.cs
          test -f Evaluate/Updates.cs
          test -f Evaluate/NNUEWeights.cs
          test -f Evaluate/NNUESettings.cs
          test -s Evaluate/Nets/simple768_2.bin

          echo "NNUE network:"
          ls -lh Evaluate/Nets/simple768_2.bin
          sha256sum Evaluate/Nets/simple768_2.bin

      - name: Configure .NET 10 and embed NNUE
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("Schneckbert.csproj")
          content = project.read_text(encoding="utf-8-sig")

          content, count = re.subn(
              r"<TargetFramework>.*?</TargetFramework>",
              "<TargetFramework>net10.0</TargetFramework>",
              content,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise SystemExit("Could not update TargetFramework.")

          network = "Evaluate/Nets/simple768_2.bin"

          content = re.sub(
              r'<EmbeddedResource\b[^>]*Include="[^"]*simple768_2\.bin"[^>]*/>',
              (
                  '<EmbeddedResource Include="Evaluate/Nets/simple768_2.bin" '
                  'LogicalName="Schneckbert.Evaluate.Nets.simple768_2.bin" />'
              ),
              content
          )

          if not re.search(
              r'<EmbeddedResource\b[^>]*Include="Evaluate/Nets/simple768_2\.bin"',
              content
          ):
              content = content.replace(
                  "</Project>",
                  """
            <ItemGroup>
              <EmbeddedResource
                Include="Evaluate/Nets/simple768_2.bin"
                LogicalName="Schneckbert.Evaluate.Nets.simple768_2.bin" />
            </ItemGroup>
          </Project>
          """,
                  1
              )

          if "<AssemblyName>Schneckbert</AssemblyName>" not in content:
              content = content.replace(
                  "</Project>",
                  """
            <PropertyGroup>
              <AssemblyName>Schneckbert</AssemblyName>
            </PropertyGroup>
          </Project>
          """,
                  1
              )

          content = re.sub(
              r"<PublishAot>.*?</PublishAot>",
              "<PublishAot>true</PublishAot>",
              content,
              flags=re.S
          )

          if "<PublishAot>" not in content:
              content = content.replace(
                  "</Project>",
                  """
            <PropertyGroup>
              <PublishAot>true</PublishAot>
              <SelfContained>true</SelfContained>
            </PropertyGroup>
          </Project>
          """,
                  1
              )

          project.write_text(content, encoding="utf-8")

          print("Updated Schneckbert.csproj:")
          print(content)
          PY

      - name: Replace AVX2 evaluator and accumulator updates
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # -------------------------------------------------------
          # 1. Scalar replacement for Evaluate.cs
          # Preserves the original AVX2 signed-short multiply
          # and multiply-add arithmetic.
          # -------------------------------------------------------

          evaluate = r'''
          using static Constants;
          using static NNUESettings;
          using static NNUEWeights;

          public unsafe partial struct Accumulator
          {
              private static short ClampActivation(short value)
              {
                  if (value < 0)
                      return 0;

                  if (value > QA)
                      return QA;

                  return value;
              }

              private static int SquareMultiply(
                  short activation,
                  short weight)
              {
                  // Matches Avx2.MultiplyLow:
                  // keep the low 16 bits, interpreted as signed.
                  short product = unchecked(
                      (short)(activation * weight));

                  // Matches Avx2.MultiplyAddAdjacent:
                  // activation * signed-short product.
                  return activation * (int)product;
              }

              public unsafe int Evaluate(ref pos p)
              {
                  int outBuck = get_material_bucket(ref p);
                  int evalAccumulator = 0;

                  short[] outputWeights = OutputWeight[outBuck][0];

                  fixed (Accumulator* accPtr = &this)
                  {
                      for (int i = 0; i < FT_SIZE; i++)
                      {
                          short activatedWhite =
                              ClampActivation(accPtr->AccWhite[i]);

                          short activatedBlack =
                              ClampActivation(accPtr->AccBlack[i]);

                          int whiteWeightIndex =
                              p.us == WHITE ? i : i + FT_SIZE;

                          int blackWeightIndex =
                              p.us == BLACK ? i : i + FT_SIZE;

                          evalAccumulator = unchecked(
                              evalAccumulator
                              + SquareMultiply(
                                  activatedWhite,
                                  outputWeights[whiteWeightIndex])
                              + SquareMultiply(
                                  activatedBlack,
                                  outputWeights[blackWeightIndex]));
                      }
                  }

                  int eval =
                      (evalAccumulator / QA
                       + OutputBias[outBuck][0])
                      * SCALE / QAB;

                  return Math.Clamp(
                      eval,
                      -EVAL_SCORE_MAX,
                      EVAL_SCORE_MAX);
              }

              public unsafe int Evaluate_wdl(ref pos p)
              {
                  int outBuck = get_material_bucket(ref p);

                  int[] outWdl = new int[3];

                  fixed (Accumulator* accPtr = &this)
                  {
                      for (int i = 0; i < FT_SIZE; i++)
                      {
                          short stmActivation =
                              ClampActivation(
                                  p.us == WHITE
                                      ? accPtr->AccWhite[i]
                                      : accPtr->AccBlack[i]);

                          short ntmActivation =
                              ClampActivation(
                                  p.us == BLACK
                                      ? accPtr->AccWhite[i]
                                      : accPtr->AccBlack[i]);

                          for (int wdl = 0; wdl < 3; wdl++)
                          {
                              // Original mapping:
                              // win = output node 2
                              // draw = output node 1
                              // loss = output node 0
                              short[] weights =
                                  OutputWeight[outBuck][2 - wdl];

                              int contribution =
                                  SquareMultiply(
                                      stmActivation,
                                      weights[i]);

                              contribution = unchecked(
                                  contribution
                                  + SquareMultiply(
                                      ntmActivation,
                                      weights[i + FT_SIZE]));

                              outWdl[wdl] = unchecked(
                                  outWdl[wdl] + contribution);
                          }
                      }
                  }

                  double win =
                      (double)(
                          outWdl[0] / QA
                          + OutputBias[outBuck][0]) / QAB;

                  double draw =
                      (double)(
                          outWdl[1] / QA
                          + OutputBias[outBuck][1]) / QAB;

                  double loss =
                      (double)(
                          outWdl[2] / QA
                          + OutputBias[outBuck][2]) / QAB;

                  double max = Math.Max(
                      win,
                      Math.Max(draw, loss));

                  win = Math.Exp(win - max);
                  draw = Math.Exp(draw - max);
                  loss = Math.Exp(loss - max);

                  double oneOverNaive =
                      (win + draw + loss)
                      / (win + draw / 2);

                  // Preserve the original integer 400 / 3.
                  double scoreCp =
                      -(400 / 3) * Math.Log2(oneOverNaive - 1);

                  return Math.Clamp(
                      (int)scoreCp,
                      -EVAL_SCORE_MAX,
                      EVAL_SCORE_MAX);
              }
          }
          '''

          eval_path = Path("Evaluate/Evaluate.cs")
          eval_path.write_text(evaluate.lstrip(), encoding="utf-8")

          print("Replaced Evaluate.cs with scalar NNUE inference.")

          # -------------------------------------------------------
          # 2. Scalar replacement for Updates.cs.
          # Vector256<short>.Add/Subtract wrap at 16 bits.
          # Use unchecked short arithmetic to preserve that.
          # -------------------------------------------------------

          updates_path = Path("Evaluate/Updates.cs")
          source = updates_path.read_text(encoding="utf-8-sig")

          source = source.replace(
              "using System.Runtime.Intrinsics.X86;\n", ""
          )
          source = source.replace(
              "using System.Runtime.Intrinsics;\n", ""
          )

          def replace_loop(method_signature, replacement):
              global source

              method_start = source.find(method_signature)

              if method_start < 0:
                  raise SystemExit(
                      f"Method not found: {method_signature}"
                  )

              loop_start = source.find(
                  "for (int i=0; i<ITERATIONS; i++)",
                  method_start
              )

              if loop_start < 0:
                  raise SystemExit(
                      f"SIMD loop not found in {method_signature}"
                  )

              brace_start = source.find("{", loop_start)

              if brace_start < 0:
                  raise SystemExit("Loop opening brace not found.")

              depth = 0
              loop_end = -1

              for index in range(brace_start, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1

                      if depth == 0:
                          loop_end = index + 1
                          break

              if loop_end < 0:
                  raise SystemExit("Could not match loop braces.")

              source = (
                  source[:loop_start]
                  + replacement
                  + source[loop_end:]
              )

          replace_loop(
              "public void AddSub(",
              """
                  for (int i = 0; i < FT_SIZE; i++)
                  {
                      unchecked
                      {
                          ptrWhite[i] = (short)(
                              ptrWhite[i]
                              + wWeightAdd[i]
                              - wWeightSub[i]);

                          ptrBlack[i] = (short)(
                              ptrBlack[i]
                              + bWeightAdd[i]
                              - bWeightSub[i]);
                      }
                  }
              """
          )

          replace_loop(
              "public void AddSubSub(",
              """
                  for (int i = 0; i < FT_SIZE; i++)
                  {
                      unchecked
                      {
                          ptrWhite[i] = (short)(
                              ptrWhite[i]
                              + wWeights1[i]
                              - wWeights2[i]
                              - wWeights3[i]);

                          ptrBlack[i] = (short)(
                              ptrBlack[i]
                              + bWeights1[i]
                              - bWeights2[i]
                              - bWeights3[i]);
                      }
                  }
              """
          )

          replace_loop(
              "public void AddAddSubSub(",
              """
                  for (int i = 0; i < FT_SIZE; i++)
                  {
                      unchecked
                      {
                          ptrWhite[i] = (short)(
                              ptrWhite[i]
                              + kingAddW[i]
                              + rookAddW[i]
                              - kingSubW[i]
                              - rookSubW[i]);

                          ptrBlack[i] = (short)(
                              ptrBlack[i]
                              + kingAddB[i]
                              + rookAddB[i]
                              - kingSubB[i]
                              - rookSubB[i]);
                      }
                  }
              """
          )

          replace_loop(
              "public void activate(",
              """
                  for (int i = 0; i < FT_SIZE; i++)
                  {
                      unchecked
                      {
                          ptrWhite[i] = (short)(
                              ptrWhite[i] + wWeights[i]);

                          prtBlack[i] = (short)(
                              prtBlack[i] + bWeights[i]);
                      }
                  }
              """
          )

          replace_loop(
              "public void deactivate(",
              """
                  for (int i = 0; i < FT_SIZE; i++)
                  {
                      unchecked
                      {
                          ptrWhite[i] = (short)(
                              ptrWhite[i] - wWeights[i]);

                          prtBlack[i] = (short)(
                              prtBlack[i] - bWeights[i]);
                      }
                  }
              """
          )

          updates_path.write_text(source, encoding="utf-8")

          if "Avx." in source or "Vector256" in source:
              raise SystemExit(
                  "AVX instructions remain in Evaluate/Updates.cs."
              )

          print("Replaced all five AVX2 update loops with scalar code.")
          PY

      - name: Verify no x86 intrinsics remain
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking C# source for x86 SIMD references..."

          if grep -RInE \
            'System\.Runtime\.Intrinsics\.X86|Avx2?\.|Vector256|Sse[0-9]*\.' \
            --include='*.cs' \
            --exclude-dir=obj \
            --exclude-dir=bin \
            .; then
            echo "::error::x86-specific SIMD references remain."
            exit 1
          fi

          echo "No direct x86 SIMD references remain."

      - name: Configure NativeAOT runtime pack
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          project = Path("Schneckbert.csproj")
          content = project.read_text(encoding="utf-8-sig")

          package_id = (
              "Microsoft.NETCore.App.Runtime.NativeAOT."
              "linux-bionic-arm64"
          )

          if package_id not in content:
              content = content.replace(
                  "</Project>",
                  """
            <ItemGroup>
              <PackageDownload
                Include="Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64"
                Version="[10.0.14]" />
            </ItemGroup>
          </Project>
          """,
                  1
              )

          project.write_text(content, encoding="utf-8")
          print("Configured .NET 10 Android NativeAOT package.")
          PY

      - name: Verify runtime pack request
        shell: bash
        run: |
          set -euo pipefail

          dotnet msbuild Schneckbert.csproj \
            -getItem:PackageDownload \
            > package-download-items.json

          cat package-download-items.json

          grep -qi \
            "Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64" \
            package-download-items.json

          grep -q "10.0.14" package-download-items.json

      - name: Restore Android ARM64 NativeAOT
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore Schneckbert.csproj \
            --runtime linux-bionic-arm64 \
            --force \
            --no-cache \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0 \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:SelfContained=true

      - name: Verify NativeAOT runtime pack
        shell: bash
        run: |
          set -euo pipefail

          PACK="$HOME/.nuget/packages/microsoft.netcore.app.runtime.nativeaot.linux-bionic-arm64/10.0.14"

          if [ ! -d "$PACK" ]; then
            echo "::error::The .NET 10 Bionic NativeAOT package is missing."
            find "$HOME/.nuget/packages" \
              -maxdepth 1 -type d \
              -iname '*nativeaot*' -print
            exit 1
          fi

          echo "NativeAOT package found: $PACK"

      - name: Publish Schneckbert ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          dotnet publish Schneckbert.csproj \
            --configuration Release \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            --output out \
            -p:TargetFramework=net10.0 \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:StripSymbols=true

          echo "Published files:"
          find out -maxdepth 2 -type f -exec ls -lh {} \;

          test -s out/Schneckbert

      - name: Verify embedded NNUE and Android ELF
        shell: bash
        run: |
          set -euo pipefail

          file out/Schneckbert

          readelf -h out/Schneckbert \
            | grep -E 'Class:|Machine:'

          readelf -h out/Schneckbert | grep -q AArch64

          echo "Checking embedded NNUE resource name..."
          if ! grep -a -q \
            'Schneckbert.Evaluate.Nets.simple768_2.bin' \
            out/Schneckbert; then
            echo "::error::Embedded NNUE resource name not found in executable."
            exit 1
          fi

          echo "Embedded NNUE resource identifier found."

          if find out -maxdepth 1 -type f \
            \( -iname '*.bin' -o -iname '*.nnue' \) | grep -q .; then
            echo "::error::External NNUE sidecar found."
            exit 1
          fi

          echo "No external NNUE sidecar."

          echo "Executable size:"
          ls -lh out/Schneckbert

          echo "Dynamic dependencies:"
          readelf -d out/Schneckbert | grep NEEDED || true

          sha256sum out/Schneckbert

      - name: Upload Schneckbert Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Schneckbert-Android-ARM64-Embedded-NNUE
          path: out/Schneckbert
          if-no-files-found: error
          retention-days: 14
